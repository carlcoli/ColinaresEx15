name: Track 4 Print Metadata
run-name: This ${{ github.actor }} is starting out GitHub Actions
on: [push]

jobs:
  print-job:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Print OS Runner Type
        run: |
          Write-Output "OS Runner Type: ${{ runner.os }}"

      - name: Print Triggering Event Name
        run: |
          Write-Output "Event Name: ${{ github.event_name }}"

      - name: Print Branch Name
        run: |
          Write-Output "Branch Name: ${{ github.ref_name }}"

      - name: Print Repository Name
        run: |
          Write-Output "Repository Name: ${{ github.repository }}"

      - name: List All Files in Workspace
        run: |
          Get-ChildItem -Recurse
